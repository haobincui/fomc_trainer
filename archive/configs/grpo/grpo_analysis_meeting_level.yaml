# ====================
# Model Arguments
# ====================
model_name_or_path: "output/merged/chapter2_analysis_sft_meeting_level"
model_revision: null

torch_dtype: "bfloat16"
attn_implementation: "flash_attention_2"

# ====================
# Data Arguments
# ====================
dataset_name: "dataset/raw_data/generate_prompt/chapter2_qa/analysis_grpo"
dataset_config: "default"
dataset_prompt_column: "prompt"
system_prompt: |
  You are a helpful AI Assistant, designed to provide well-reasoned and detailed responses.
  You FIRST think about the reasoning process as an internal monologue and then provide the user with the answer.
  The reasoning process MUST BE enclosed within <think> and </think> tags. The answer MUST BE enclosed within <answer> and </answer> tags.

# ====================
# Trainer (GRPO) Arguments
# ====================
bf16: true

# Optimization
gradient_accumulation_steps: 4
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
learning_rate: 1.0e-05
lr_scheduler_type: cosine_with_min_lr
lr_scheduler_kwargs:
  min_lr_rate: 0.1
warmup_ratio: 0.1

dataloader_num_workers: 0
dataloader_pin_memory: false

# Evaluation
do_eval: false
eval_strategy: "no"
eval_steps: 20

# Training Steps
max_steps: -1
num_train_epochs: 1

# Input Length Settings
max_prompt_length: 4096
max_completion_length: 2048
num_generations: 4

# Batch Sizes
per_device_train_batch_size: 1
per_device_eval_batch_size: 4

# ====================
# Reward Settings
# ====================
reward_funcs:
  - reasoning
  - answer
reward_weights:
  - 0.4
  - 0.6
save_reward: true

# ====================
# PEFT LoRA Configuration
# ====================
peft_merged_model_path: output/merged/chapter2_analysis_grpo_meeting_level
peft_r: 8
peft_lora_alpha: 16
peft_lora_dropout: 0.05
peft_bias: "none"
peft_task_type: "CAUSAL_LM"
peft_target_modules:
  - q_proj
  - v_proj

# ====================
# Logging & Saving
# ====================
log_completions: true
log_level: "info"
logging_strategy: "steps"
logging_steps: 1
logging_first_step: true

output_dir: output/adapters/chapter2_analysis_grpo_meeting_level
overwrite_output_dir: true
save_strategy: "steps"
save_steps: 200
save_total_limit: 10
callbacks:
  - loss_log
  - reward_log

# ====================
# Miscellaneous
# ====================
push_to_hub: false
report_to: []
seed: 42
