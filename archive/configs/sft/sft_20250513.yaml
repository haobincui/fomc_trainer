# ====================
# Model Arguments
# ====================
model_name_or_path: "models/DeepSeek-R1-Distill-Llama-8B"
model_revision: "20250513"
torch_dtype: "bfloat16"
attn_implementation: "flash_attention_2"

# ====================
# Data Arguments
# ====================
dataset_name: "dataset/training_data/fomc_qa_sft"
dataset_prompt_column: "prompt"
system_prompt: |
  You are a helpful AI Assistant, designed to provide well-reasoned and detailed responses. 
  You FIRST think about the reasoning process as an internal monologue and then provide the user with the answer. 
  The reasoning process MUST BE enclosed within <think> and </think> tags.

# ====================
# Trainer (SFT) Arguments
# ====================
bf16: true

# Optimization
gradient_accumulation_steps: 2
gradient_checkpointing: false
gradient_checkpointing_kwargs:
  use_reentrant: false
learning_rate: 3.0e-06
lr_scheduler_type: "cosine"
lr_scheduler_kwargs:
  min_lr_rate: 0.1
warmup_ratio: 0.1
packing: false

# ====================
# Evaluation
# ====================
do_eval: true
eval_strategy: "steps"
eval_steps: 20

# ====================
# Training Steps
# ====================
max_steps: -1            # -1 means no limit (run until epochs complete)
num_train_epochs: 2


# ====================
# Generation Settings (optional, if inference involved)
# ====================
top_p: 0.9
temperature: 0.6
max_prompt_length: 16384
max_completion_length: 8196

# ====================
# Batch Sizes
# ====================
per_device_train_batch_size: 2
per_device_eval_batch_size: 4

# ====================
# PEFT LoRA Configuration
# ====================
#peft_adapter_path: "output/llama_sft_20250512"

peft_r: 8
peft_lora_alpha: 16
peft_lora_dropout: 0.05
peft_bias: "none"
peft_task_type: "CAUSAL_LM"
peft_target_modules:
  - q_proj
  - v_proj

# ====================
# Output & Saving
# ====================
output_dir: "output/llama_sft_20250513"
overwrite_output_dir: true
save_strategy: "steps"
save_steps: 500
save_total_limit: 1
callbacks:
  - loss_log

# ====================
# Logging
# ====================
log_level: "info"
logging_strategy: "steps"
logging_steps: 20

# ====================
# Miscellaneous
# ====================
push_to_hub: false
report_to: []
seed: 42
use_liger_kernel: true

