model_name_or_path: output/training/retrain_v2/__RUN_ID__/merged/chk2
model_revision: null
dtype: bfloat16
attn_implementation: sdpa
load_in_4bit: true
bnb_4bit_quant_type: nf4
use_bnb_nested_quant: true
bnb_4bit_quant_storage: bfloat16

dataset_name: dataset/processed/retrain_v2/__DERIVED_RELEASE_ID__/decision_grpo
dataset_prompt_column: prompt
dataset_train_split: train
dataset_test_split: validation
system_prompt: |
  Make one policy decision using only the supplied pre-meeting evidence and
  frozen chk2 analyses. The final answer must be exactly one JSON object with
  direction cut, hold, or hike and magnitude_bp 0, 25, 50, 75, or 100.

bf16: true
tf32: true
optim: paged_adamw_8bit
gradient_accumulation_steps: 4
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
learning_rate: 1.0e-06
lr_scheduler_type: cosine
warmup_ratio: 0.05
weight_decay: 0.01
max_grad_norm: 1.0
dataloader_num_workers: 0
dataloader_pin_memory: false

do_eval: false
eval_strategy: "no"
num_train_epochs: 3
max_prompt_length: 2560
# DeepSeek-R1 must have enough room to close its native reasoning boundary
# before the strict final JSON.  The 256-token profile was prone to masked,
# zero-signal truncations; 512 remains well below the measured A30 gate.
max_completion_length: 512
chat_template_kwargs:
  truncation: false
  max_length: 2560
num_generations: 4
generation_batch_size: 8
temperature: 0.7
top_p: 0.9
beta: 0.04
loss_type: dapo
scale_rewards: group
epsilon: 0.2
num_iterations: 1
importance_sampling_level: token
mask_truncated_completions: true
per_device_train_batch_size: 1
per_device_eval_batch_size: 2
ddp_find_unused_parameters: false
use_vllm: false

reward_funcs:
  - decision_dense_v2
reward_weights:
  - 1.0
save_reward: true

peft_merged_model_path: output/training/retrain_v2/__RUN_ID__/merged/chk4
peft_r: 32
peft_lora_alpha: 64
peft_lora_dropout: 0.05
peft_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

output_dir: output/training/retrain_v2/__RUN_ID__/adapters/chk4
overwrite_output_dir: false
save_strategy: steps
save_steps: 1
save_total_limit: null
save_only_model: false
checkpoint_keep_last: 3
checkpoint_keep_every_n_steps: 10
callbacks:
  - loss_log
  - reward_log
  - checkpoint_retention
log_completions: true
log_level: info
logging_strategy: steps
logging_steps: 1
logging_first_step: true
push_to_hub: false
report_to: []
seed: 42
data_seed: 42
use_cache: false
use_liger_kernel: false
