model_name_or_path: models/DeepSeek-R1-Distill-Llama-8B
model_revision: null
dtype: bfloat16
attn_implementation: flex_attention
load_in_4bit: true
bnb_4bit_quant_type: nf4
use_bnb_nested_quant: true
bnb_4bit_quant_storage: bfloat16

dataset_name: dataset/processed/retrain_v2/__BASE_RELEASE_ID__/analysis_sft
dataset_prompt_column: prompt
dataset_train_split: train
dataset_test_split: validation
system_prompt: |
  Analyze only the supplied point-in-time FOMC evidence. Do not infer facts from
  later releases or from the target meeting's Minutes. Use the model's native
  reasoning boundary, then provide a concise, evidence-grounded final analysis.

bf16: true
tf32: true
optim: paged_adamw_8bit
gradient_accumulation_steps: 8
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
learning_rate: 5.0e-05
lr_scheduler_type: cosine
warmup_ratio: 0.05
weight_decay: 0.01
max_grad_norm: 1.0
packing: false
completion_only_loss: true
max_length: 7168

do_eval: true
eval_strategy: steps
eval_steps: 10
num_train_epochs: 2
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
ddp_find_unused_parameters: false
dataloader_num_workers: 2
dataloader_pin_memory: true

peft_merged_model_path: output/training/retrain_v2/__RUN_ID__/merged/chk1
peft_r: 32
peft_lora_alpha: 64
peft_lora_dropout: 0.05
peft_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

output_dir: output/training/retrain_v2/__RUN_ID__/adapters/chk1
overwrite_output_dir: false
save_strategy: steps
save_steps: 1
save_total_limit: null
save_only_model: false
checkpoint_keep_last: 3
checkpoint_keep_every_n_steps: 10
callbacks:
  - loss_log
  - checkpoint_retention
log_level: info
logging_strategy: steps
logging_steps: 10
logging_first_step: true
push_to_hub: false
report_to: []
seed: 42
data_seed: 42
use_cache: false
use_liger_kernel: true
activation_offloading: false
