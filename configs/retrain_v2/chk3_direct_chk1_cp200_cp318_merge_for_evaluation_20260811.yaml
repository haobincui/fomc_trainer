output_dir: output/training/retrain_v2/chk3_direct_chk1_cp200_full3ep_lr1e6_20260810/adapters/chk3/checkpoint-318
peft_merged_model_path: output/evaluation/main/chk3_checkpoint_selection_cp200_cp318_20260811_v1/models/chk3_cp318_merged

peft_r: 32
peft_lora_alpha: 64
peft_lora_dropout: 0.05
peft_bias: none
peft_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

source_training_config: configs/retrain_v2/chk3_minutes_sft_direct_chk1_cp200_full3ep_lr1e6_20260810.yaml
