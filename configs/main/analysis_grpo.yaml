model_name_or_path: "output/training/main/merged/analysis_sft"
model_revision: null
dtype: "bfloat16"
attn_implementation: "sdpa"

dataset_name: "dataset/processed/train/analysis_grpo"
dataset_prompt_column: "prompt"
system_prompt: |
  <|think|>
  You are a helpful AI Assistant, designed to provide well-reasoned and detailed responses.
  Think carefully as internal reasoning before answering.
  Use the model's native thought-channel output format and do not emit legacy XML wrapper tags.

bf16: true
gradient_accumulation_steps: 4
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
learning_rate: 1.0e-05
lr_scheduler_type: cosine_with_min_lr
lr_scheduler_kwargs:
  min_lr_rate: 0.1
warmup_ratio: 0.1
dataloader_num_workers: 0
dataloader_pin_memory: false

do_eval: false
eval_strategy: "no"
eval_steps: 20

max_steps: -1
num_train_epochs: 1
max_completion_length: 2048
chat_template_kwargs:
  truncation: true
  max_length: 4096
num_generations: 4
per_device_train_batch_size: 1
per_device_eval_batch_size: 4

reward_funcs:
  - format
  - answer
  - reasoning
reward_weights:
  - 0.2
  - 0.4
  - 0.4
save_reward: true

peft_merged_model_path: output/training/main/merged/analysis_grpo
peft_r: 8
peft_lora_alpha: 16
peft_lora_dropout: 0.05
peft_target_modules:
  - q_proj
  - v_proj

log_completions: true
log_level: "info"
logging_strategy: "steps"
logging_steps: 1
logging_first_step: true

output_dir: output/training/main/adapters/analysis_grpo
save_strategy: "steps"
save_steps: 200
save_total_limit: 10
callbacks:
  - loss_log
  - reward_log

push_to_hub: false
report_to: []
seed: 42
