model_name_or_path: "output/training/main/merged/analysis_sft"
model_revision: null
torch_dtype: "bfloat16"
attn_implementation: "flash_attention_2"

dataset_name: "dataset/processed/train/decision_sft"
dataset_prompt_column: "prompt"
system_prompt: |
  <|think|>
  You are a helpful AI Assistant, designed to provide well-reasoned and detailed responses.
  Think carefully as internal reasoning before answering.
  Use the model's native thought-channel output format and do not emit legacy XML wrapper tags.

bf16: true
load_in_4bit: false
gradient_accumulation_steps: 2
gradient_checkpointing: false
gradient_checkpointing_kwargs:
  use_reentrant: false
learning_rate: 1.0e-05
lr_scheduler_type: cosine_with_min_lr
lr_scheduler_kwargs:
  min_lr_rate: 0.1
warmup_ratio: 0.1
packing: false

do_eval: true
eval_strategy: "steps"
eval_steps: 20

max_steps: -1
num_train_epochs: 3
top_p: 0.9
temperature: 0.6
max_prompt_length: 16384
max_completion_length: 8192
per_device_train_batch_size: 1
per_device_eval_batch_size: 2

peft_merged_model_path: output/training/main/merged/decision_sft
peft_r: 8
peft_lora_alpha: 16
peft_lora_dropout: 0.05
peft_target_modules:
  - q_proj
  - v_proj

output_dir: output/training/main/adapters/decision_sft
overwrite_output_dir: true
save_strategy: "steps"
save_steps: 500
save_total_limit: 1
callbacks:
  - loss_log

log_level: "info"
logging_strategy: "steps"
logging_steps: 20

push_to_hub: false
report_to: []
seed: 42
use_liger_kernel: true
