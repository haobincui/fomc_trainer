# ====================
# Model Arguments
# ====================
model_name_or_path: "models/llama3-8b"
model_revision: "20250514"
torch_dtype: "bfloat16"
attn_implementation: "flash_attention_2"

# ====================
# Data Arguments
# ====================
dataset_name_or_path: dataset/training_data/fomc_qa_grpo
dataset_config: "default"
dataset_prompt_column: "problem"
system_prompt: |
  You are a helpful AI Assistant, designed to provide well-reasoned and detailed responses. 
  You FIRST think about the reasoning process as an internal monologue and then provide the user with the answer. 
  The reasoning process MUST BE enclosed within <think> and </think> tags.

# ====================
# Trainer (GRPO) Arguments
# ====================
bf16: true

# vLLM Settings
use_vllm: true
vllm_gpu_memory_utilization: 0.95
vllm_mode: "colocate"

# Optimization
gradient_accumulation_steps: 2
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
learning_rate: 3.0e-06
lr_scheduler_type: "cosine"
warmup_ratio: 0.1

# Evaluation
do_eval: true
eval_strategy: steps
eval_steps: 20

# Training Steps
max_steps: -1            # -1 means no limit (run until epochs complete)
num_train_epochs: 1


# Input Length Settings
max_prompt_length: 16384
max_completion_length: 8196
num_generations: 7

# Batch Sizes
per_device_train_batch_size: 2
per_device_eval_batch_size: 4

# ====================
# Reward Settings
# ====================
reward_funcs:
  - reasoning
  - answer
  - format
reward_weights:
  - 0.5
  - 1.0
  - 1.0
save_reward: true

# ====================
# PEFT LoRA Configuration
# ====================
peft_adapter_path: "output/llama_sft_20250512"
peft_r: 8
peft_lora_alpha: 16
peft_lora_dropout: 0.05
peft_bias: "none"
peft_task_type: "CAUSAL_LM"
peft_target_modules:
  - q_proj
  - v_proj


# ====================
# Logging & Saving
# ====================
log_completions: true
log_level: "info"
logging_strategy: "steps"
logging_steps: 20
logging_first_step: true

output_dir: "output/llama_grpo_20250513"
overwrite_output_dir: true
save_strategy: "no"
callbacks:
  - loss_log

# ====================
# Miscellaneous
# ====================
push_to_hub: false
# hub_model_id: "Qwen-2.5-7B-Simple-RL"
# hub_strategy: "every_save"
# report_to: ["wandb"]
seed: 42
